apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: {{ include "icai-introbbdd.namespace" . }}
  labels:
    {{- include "icai-introbbdd.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    nodePort: {{ .Values.service.nodePort }}
    protocol: TCP
  selector:
    {{- include "icai-introbbdd.selectorLabels" . | nindent 4 }}
